<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arma tu Motociclista — Seguridad Vial BA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <style>
    :root {
      --bg: #121414;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --neon-blue: #00f3ff;
      --neon-green: #00ff66;
      --neon-red: #ff4444;
      --text: #f0f4f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    body { height: 100vh; display: flex; flex-direction: column; background-color: var(--bg); font-family: 'Archivo', sans-serif; color: var(--text); overflow: hidden; }

    /* HEADER */
    .app-header {
      width: 100%; background: rgba(18, 20, 20, 0.85); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--glass-border); padding: 12px 20px; z-index: 50;
    }
    .header-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-back { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 12px; background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; text-decoration: none; }
    .header-title-text { font-family: 'Archivo Black', sans-serif; font-size: 16px; letter-spacing: 0.5px; color: #fff; text-transform: uppercase; }

    /* GAME LAYOUT */
    .game-container { flex: 1; display: flex; flex-direction: column; position: relative; }
    
    /* DROPZONE (TOP) */
    .dropzone-container { flex: 1.2; position: relative; display: flex; justify-content: center; align-items: center; padding: 20px; background: radial-gradient(circle at center, rgba(0,243,255,0.05) 0%, transparent 70%); }
    .silhouette { max-height: 100%; max-width: 100%; object-fit: contain; opacity: 0.6; filter: drop-shadow(0 0 10px rgba(0,243,255,0.2)); transition: opacity 0.3s; }
    
    .dropzone-area { position: absolute; inset: 20px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 20px; transition: all 0.3s; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 10px; padding: 10px; }
    .dropzone-area.drag-over { border-color: var(--neon-blue); background: rgba(0, 243, 255, 0.1); }
    
    /* INVENTORY CAROUSEL (BOTTOM) */
    .inventory-panel { height: 200px; background: rgba(0,0,0,0.5); backdrop-filter: blur(15px); border-top: 1px solid var(--glass-border); display: flex; flex-direction: column; }
    .inventory-header { padding: 10px 20px; font-weight: 700; font-size: 14px; color: #aaa; text-transform: uppercase; display: flex; justify-content: space-between; }
    
    .carousel { flex: 1; display: flex; gap: 15px; padding: 0 20px 20px 20px; overflow-x: auto; scroll-snap-type: x mandatory; touch-action: pan-x; }
    .carousel::-webkit-scrollbar { display: none; }
    
    .item-card { scroll-snap-align: center; width: 100px; height: 120px; flex-shrink: 0; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; cursor: grab; position: relative; overflow: hidden; }
    .item-card img { width: 100%; height: 70px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; pointer-events: none; }
    .item-name { font-size: 11px; font-weight: 700; text-align: center; pointer-events: none; }
    
    .item-card.equipped { opacity: 0.5; pointer-events: none; border-color: var(--neon-green); }
    
    /* DRAG GHOST */
    .drag-ghost { position: absolute; pointer-events: none; z-index: 100; transform: translate(-50%, -50%); opacity: 0.9; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 16px; border: 2px solid var(--neon-blue); background: #121414; padding: 10px; display: none; }
    .drag-ghost img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }

    /* EQUIPPED CHIPS IN DROPZONE */
    .equipped-chip { background: rgba(0,255,102,0.1); border: 1px solid var(--neon-green); color: var(--neon-green); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; box-shadow: 0 0 10px rgba(0,255,102,0.2); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* ACTION BUTTON */
    .action-row { position: absolute; bottom: 210px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
    .btn-action { pointer-events: auto; padding: 16px 32px; border-radius: 30px; background: #FFC600; color: #000; font-family: 'Archivo Black'; font-size: 16px; border: none; box-shadow: 0 4px 15px rgba(255, 198, 0, 0.4); text-transform: uppercase; cursor: pointer; transition: transform 0.2s; }
    .btn-action:active { transform: scale(0.95); }

    /* FEEDBACK OVERLAYS */
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; display: none; }
    .overlay h1 { font-family: 'Archivo Black'; margin-bottom: 15px; font-size: 28px; }
    .overlay p { color: #aaa; font-size: 16px; margin-bottom: 25px; max-width: 320px; }
    .btn-retry { padding: 14px 30px; background: var(--glass-bg); color: #fff; border: 1px solid var(--glass-border); border-radius: 12px; font-family: 'Archivo Black'; font-size: 14px; }
    
    .error-flash { animation: flashRed 0.5s ease-out; }
    @keyframes flashRed { 0% { background: rgba(255,0,0,0.4); } 100% { background: transparent; } }
    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }

  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="juegos.html" class="btn-back"><span class="material-symbols-outlined">arrow_back</span></a>
        <span class="header-title-text">Equipando al Motociclista</span>
      </div>
    </div>
  </header>

  <div class="game-container" id="game-arena">
    <!-- DROPZONE -->
    <div class="dropzone-container">
      <img src="assets/silueta_moto.png" alt="Silueta" class="silhouette" id="silhouette">
      <div class="dropzone-area" id="dropzone">
        <!-- Equipped items will appear here as chips -->
      </div>
    </div>

    <!-- BUTTON -->
    <div class="action-row">
      <button class="btn-action" id="btn-submit">Salir a la ruta</button>
    </div>

    <!-- INVENTORY -->
    <div class="inventory-panel">
      <div class="inventory-header">
        <span>Inventario EPP</span>
        <span id="equipped-counter">0/4 Obligatorios</span>
      </div>
      <div class="carousel" id="inventory">
        <!-- Items will be injected here -->
      </div>
    </div>

    <!-- DRAG GHOST -->
    <div class="drag-ghost" id="drag-ghost">
      <img id="ghost-img" src="" alt="">
    </div>

    <!-- OVERLAYS -->
    <div class="overlay" id="overlay-error">
      <span class="material-symbols-outlined" style="font-size: 64px; color: var(--neon-red); margin-bottom: 10px;">warning</span>
      <h1 style="color: var(--neon-red);">¡PELIGRO!</h1>
      <p id="error-msg">Te falta equipamiento obligatorio para circular seguro y dentro de la ley.</p>
      <button class="btn-retry" onclick="document.getElementById('overlay-error').style.display='none'">VOLVER AL INVENTARIO</button>
    </div>

    <div class="overlay" id="overlay-win">
      <span class="material-symbols-outlined" style="font-size: 64px; color: var(--neon-green); margin-bottom: 10px;">verified</span>
      <h1 style="color: var(--neon-green);">¡LISTO PARA RODAR!</h1>
      <p>Has equipado todos los elementos esenciales. ¡Buen viaje y respeta las normas!</p>
      <button class="btn-action" onclick="location.reload()" style="margin-top: 20px;">JUGAR DE NUEVO</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const items = [
      { id: 'casco', name: 'Casco', src: 'Imagenes de moto E/EPP/Casco.jfif', required: true },
      { id: 'calzado', name: 'Calzado', src: 'Imagenes de moto E/EPP/Calzado.jfif', required: true },
      { id: 'campera', name: 'Campera', src: 'Imagenes de moto E/EPP/Campera.jfif', required: true },
      { id: 'pantalon', name: 'Pantalón', src: 'Imagenes de moto E/EPP/Pantalón.jfif', required: true },
      { id: 'guantes', name: 'Guantes', src: 'Imagenes de moto E/EPP/Guantes.jfif', required: false },
      { id: 'chaleco', name: 'Chaleco Refractario', src: 'Imagenes de moto E/EPP/Chaleco.jfif', required: false },
      { id: 'alforjas', name: 'Alforjas', src: 'Imagenes de moto E/Protección vehicular/Alforjas.jfif', required: false }
    ];

    const inventory = document.getElementById('inventory');
    const dropzone = document.getElementById('dropzone');
    const ghost = document.getElementById('drag-ghost');
    const ghostImg = document.getElementById('ghost-img');
    const counter = document.getElementById('equipped-counter');
    const arena = document.getElementById('game-arena');

    let equipped = new Set();
    let isDragging = false;
    let currentDragId = null;

    // Initialize Inventory
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.dataset.id = item.id;
      card.innerHTML = `
        <img src="${item.src}" alt="${item.name}">
        <span class="item-name">${item.name}</span>
      `;
      
      // Touch and Mouse events for dragging
      card.addEventListener('mousedown', handleDragStart);
      card.addEventListener('touchstart', handleDragStart, {passive: false});
      
      inventory.appendChild(card);
    });

    // Drag Logic
    function handleDragStart(e) {
      const target = e.currentTarget;
      if (target.classList.contains('equipped')) return;
      
      isDragging = true;
      currentDragId = target.dataset.id;
      
      const itemData = items.find(i => i.id === currentDragId);
      ghostImg.src = itemData.src;
      ghost.style.display = 'block';
      
      moveDrag(e);
    }

    function moveDrag(e) {
      if (!isDragging) return;
      e.preventDefault(); // prevent scroll
      
      let clientX = e.clientX || (e.touches && e.touches[0].clientX);
      let clientY = e.clientY || (e.touches && e.touches[0].clientY);
      
      ghost.style.left = clientX + 'px';
      ghost.style.top = clientY + 'px';

      // Highlight dropzone if over it
      const dzRect = dropzone.getBoundingClientRect();
      if (clientX > dzRect.left && clientX < dzRect.right && clientY > dzRect.top && clientY < dzRect.bottom) {
        dropzone.classList.add('drag-over');
      } else {
        dropzone.classList.remove('drag-over');
      }
    }

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      ghost.style.display = 'none';
      dropzone.classList.remove('drag-over');
      
      let clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
      let clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);
      
      const dzRect = dropzone.getBoundingClientRect();
      
      // Check if dropped inside dropzone
      if (clientX > dzRect.left && clientX < dzRect.right && clientY > dzRect.top && clientY < dzRect.bottom) {
        equipItem(currentDragId);
      }
      
      currentDragId = null;
    }

    document.addEventListener('mousemove', moveDrag);
    document.addEventListener('touchmove', moveDrag, {passive: false});
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);

    // Equip Logic
    function equipItem(id) {
      if (equipped.has(id)) return;
      equipped.add(id);
      
      const itemData = items.find(i => i.id === id);
      const card = document.querySelector(`.item-card[data-id="${id}"]`);
      card.classList.add('equipped');

      // Create Chip in dropzone
      const chip = document.createElement('div');
      chip.className = 'equipped-chip';
      chip.innerHTML = `<span class="material-symbols-outlined" style="font-size:16px;">check_circle</span> ${itemData.name}`;
      dropzone.appendChild(chip);

      // Increase opacity of silhouette
      document.getElementById('silhouette').style.opacity = Math.min(1, 0.6 + (equipped.size * 0.1));

      updateCounter();
    }

    function updateCounter() {
      const requiredItems = items.filter(i => i.required);
      let reqCount = 0;
      requiredItems.forEach(req => {
        if (equipped.has(req.id)) reqCount++;
      });
      counter.innerText = `${reqCount}/${requiredItems.length} Obligatorios`;
    }

    // Submit Logic
    document.getElementById('btn-submit').addEventListener('click', () => {
      const requiredItems = items.filter(i => i.required);
      let missing = [];
      
      requiredItems.forEach(req => {
        if (!equipped.has(req.id)) missing.push(req.name);
      });

      if (missing.length > 0) {
        // Error
        arena.classList.add('shake');
        document.body.classList.add('error-flash');
        setTimeout(() => {
          arena.classList.remove('shake');
          document.body.classList.remove('error-flash');
          document.getElementById('error-msg').innerText = `Te falta: ${missing.join(', ')}`;
          document.getElementById('overlay-error').style.display = 'flex';
        }, 400);
      } else {
        // Win
        document.getElementById('overlay-win').style.display = 'flex';
        confetti({
          particleCount: 150,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#00ff66', '#00f3ff', '#ffffff']
        });
      }
    });

  </script>
</body>
</html>
