<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow3rd" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f4b66"/>
      <stop offset="100%" stop-color="#153244"/>
    </radialGradient>
    <linearGradient id="bronzePodiumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6AD7B"/>
      <stop offset="40%" stop-color="#CD7F32"/>
      <stop offset="85%" stop-color="#9C5221"/>
      <stop offset="100%" stop-color="#7C3A16"/>
    </linearGradient>
    <linearGradient id="bronzeShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD4B2"/>
      <stop offset="100%" stop-color="#CD7F32"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#071219" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Card Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGlow3rd)"/>

  <!-- Olympic / Gaming Ribbon Top Banner -->
  <g filter="url(#shadow3)">
    <!-- Hanging V-ribbon in Turquoise Mint with dark navy trim -->
    <path d="M 44 12 L 56 42 L 44 42 L 34 12 Z" fill="#8DE2D6"/>
    <path d="M 84 12 L 72 42 L 84 42 L 94 12 Z" fill="#8DE2D6"/>
    <path d="M 40 12 L 46 42 L 43 42 L 37 12 Z" fill="#153244" opacity="0.6"/>
    <path d="M 88 12 L 82 42 L 85 42 L 91 12 Z" fill="#153244" opacity="0.6"/>
    <!-- Bronze loop connector -->
    <rect x="56" y="34" width="16" height="8" rx="3" fill="#CD7F32" stroke="#8C4415" stroke-width="1.5"/>
  </g>

  <!-- 3rd Place Bronze Badge Medallion -->
  <g filter="url(#shadow3)">
    <!-- Outer Warm Bronze Rim -->
    <circle cx="64" cy="72" r="39" fill="url(#bronzePodiumGrad)" stroke="#F6AD7B" stroke-width="2"/>
    <!-- Inner Dark Asphalt Inset -->
    <circle cx="64" cy="72" r="32" fill="#12202B" stroke="#CD7F32" stroke-width="2"/>

    <!-- Road Track Dashed Inner Ring (Road Safety Motif) -->
    <circle cx="64" cy="72" r="27" fill="none" stroke="#FFC600" stroke-width="2" stroke-dasharray="4,4" opacity="0.9"/>

    <!-- Bronze Road Safety Cones / Star Top Emblem -->
    <g transform="translate(64, 52)">
      <!-- Traffic Cone & Victory Star Motif -->
      <polygon points="0,-8 2,-2 8,-2 3,1 5,7 0,3 -5,7 -3,1 -8,-2 -2,-2" fill="#FFC600"/>
      <circle cx="-10" cy="1" r="2" fill="#F6AD7B"/>
      <circle cx="10" cy="1" r="2" fill="#F6AD7B"/>
    </g>

    <!-- Large Bold "3" Graphic (Game 3rd Place) -->
    <g transform="translate(64, 76)">
      <!-- Central Bold Number 3 -->
      <text x="0" y="8" fill="url(#bronzeShine)" font-family="'Archivo Black', 'Arial Black', sans-serif" font-weight="900" font-size="28" text-anchor="middle" filter="drop-shadow(0px 2px 0px #572507)">3</text>
      <!-- Small laurel side twigs in bronze -->
      <path d="M -18 -4 C -22 6 -16 16 -12 18" fill="none" stroke="#CD7F32" stroke-width="2" stroke-linecap="round"/>
      <path d="M 18 -4 C 22 6 16 16 12 18" fill="none" stroke="#CD7F32" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- "3er LUGAR / BRONCE" Ribbon Pill at Bottom -->
    <g transform="translate(64, 105)">
      <rect x="-34" y="-8" width="68" height="16" rx="8" fill="#CD7F32" stroke="#153244" stroke-width="1.5"/>
      <text x="0" y="3.5" fill="#FFFFFF" font-family="'Archivo Black', 'Arial Black', sans-serif" font-weight="900" font-size="8.5" text-anchor="middle" letter-spacing="0.8">3° LUGAR</text>
    </g>
  </g>
</svg>