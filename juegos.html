<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zona de Práctica — Juegos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #121414;
      font-family: 'Archivo', sans-serif;
      color: #e2e2e2;
    }

    /* ── CABECERA COMPACTA DE LA PESTAÑA ── */
    .tab-header {
      width: 100%;
      background: #161818;
      border-bottom: 1px solid rgba(141, 226, 214, 0.18);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    }
    .header-inner {
      max-width: 580px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 20px;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .header-metric {
      font-size: 13px;
      font-weight: 700;
      color: #8DE2D6;
      letter-spacing: 0.3px;
    }
    .progress-bar-track {
      width: 100%;
      height: 5px;
      background: #252828;
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 40%;
      height: 100%;
      background: #8DE2D6;
      border-radius: 9999px;
      box-shadow: 0 0 10px rgba(141, 226, 214, 0.7);
      transition: width 0.4s ease;
    }

    /* ── ÁREA PRINCIPAL CON TEXTO Y BOTÓN RULETA ── */
    .tab-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      max-width: 580px;
      margin: 0 auto;
      width: 100%;
      text-align: center;
      gap: 22px;
    }
    .tab-description-card {
      background: rgba(30, 32, 32, 0.6);
      border: 1px solid rgba(141, 226, 214, 0.15);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .tab-description {
      font-size: 15px;
      line-height: 1.6;
      color: #c2c7cc;
      margin: 0;
    }
    .btn-ruleta {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 28px 44px;
      background: #1e2020;
      border: 3px solid #FFC600;
      border-radius: 28px;
      box-shadow: 0 10px 0 #C99B00, 0 18px 36px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      outline: none;
      user-select: none;
    }
    .btn-ruleta:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 0 #C99B00, 0 24px 44px rgba(255, 198, 0, 0.25);
      border-color: #ffe6ae;
    }
    .btn-ruleta:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #C99B00, 0 8px 18px rgba(0, 0, 0, 0.4);
    }
    .btn-ruleta img {
      width: 170px;
      height: 170px;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
      pointer-events: none;
    }
    .btn-ruleta span {
      font-family: 'Archivo Black', sans-serif;
      font-size: 26px;
      letter-spacing: 1.5px;
      color: #FFC600;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }
    .btn-hint {
      font-size: 13px;
      color: #8c9196;
      margin-top: -6px;
    }
  </style>
</head>
<body>

  <!-- 1. Cabecera compacta de la pestaña -->
  <header class="tab-header">
    <div class="header-inner">
      <div class="header-top-row">
        <h1 class="header-title">Zona de Práctica</h1>
        <span class="header-metric" id="metric-completed">Completados: 4/10</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>
  </header>

  <!-- Contenido con texto y botón RULETA VIAL -->
  <main class="tab-main">
    <div class="tab-description-card">
      <p class="tab-description">
        Jugá, practicá y poné a prueba tus reflejos en cada desafío. Transformá tus decisiones en hábitos seguros para moverte mejor por la calle.
      </p>
    </div>

    <button class="btn-ruleta" id="btn-ruleta" onclick="window.location.href='index.html?screen=modalidades'">
      <img src="assets/ruleta_icono.jpg" alt="Ruleta">
      <span>RULETA VIAL</span>
    </button>
    <span class="btn-hint">Tocá la ruleta para acceder a todas las modalidades</span>
  </main>

</body>
</html>
