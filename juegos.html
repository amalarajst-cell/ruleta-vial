<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juegos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #121414;
      padding: 24px;
    }
    .btn-ruleta {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 28px 40px;
      background: #1e2020;
      border: 3px solid #FFC600;
      border-radius: 28px;
      box-shadow: 0 10px 0 #C99B00, 0 18px 36px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      outline: none;
      user-select: none;
    }
    .btn-ruleta:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 0 #C99B00, 0 24px 44px rgba(255, 198, 0, 0.25);
      border-color: #ffe6ae;
    }
    .btn-ruleta:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #C99B00, 0 8px 18px rgba(0, 0, 0, 0.4);
    }
    .btn-ruleta img {
      width: 170px;
      height: 170px;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
      pointer-events: none;
    }
    .btn-ruleta span {
      font-family: 'Archivo Black', sans-serif;
      font-size: 26px;
      letter-spacing: 1.5px;
      color: #FFC600;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <button class="btn-ruleta" id="btn-ruleta" onclick="window.location.href='index.html?screen=roulette'">
    <img src="assets/ruleta_icono.jpg" alt="Ruleta">
    <span>RULETA VIAL</span>
  </button>

</body>
</html>
