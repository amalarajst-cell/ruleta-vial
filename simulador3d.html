<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador 3D — Seguridad Vial BA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <style>
    :root {
      --neon-blue: #00f3ff;
      --neon-pink: #ff007f;
      --bg: #050510;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; background-color: var(--bg); font-family: 'Archivo', sans-serif; }
    
    /* HEADER */
    .app-header {
      position: absolute; top: 0; left: 0; width: 100%;
      background: rgba(5, 5, 16, 0.7); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding: 12px 20px; z-index: 50;
    }
    .header-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-back { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; text-decoration: none; }
    .header-title-text { font-family: 'Archivo Black', sans-serif; font-size: 16px; letter-spacing: 0.5px; color: var(--neon-blue); text-transform: uppercase; text-shadow: 0 0 10px rgba(0,243,255,0.5); }

    /* HUD */
    .hud { position: absolute; top: 70px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
    .score-box { background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 10px 20px; border-radius: 12px; border: 1px solid var(--neon-blue); color: #fff; font-family: 'Archivo Black'; font-size: 20px; box-shadow: 0 0 15px rgba(0,243,255,0.3); }
    
    /* OVERLAYS */
    .overlay { position: absolute; inset: 0; background: rgba(5,5,16,0.85); z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; backdrop-filter: blur(5px); }
    .overlay h1 { font-family: 'Archivo Black'; margin-bottom: 15px; font-size: 32px; color: var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink); }
    .overlay p { color: #fff; font-size: 16px; margin-bottom: 30px; max-width: 300px; line-height: 1.5; }
    .btn-action { pointer-events: auto; padding: 16px 40px; border-radius: 30px; background: var(--neon-blue); color: #000; font-family: 'Archivo Black'; font-size: 18px; border: none; box-shadow: 0 0 20px rgba(0, 243, 255, 0.6); text-transform: uppercase; cursor: pointer; transition: transform 0.2s; }
    .btn-action:active { transform: scale(0.95); }

    /* TOUCH CONTROLS HINT */
    .controls-hint { position: absolute; bottom: 40px; left: 0; width: 100%; text-align: center; color: rgba(255,255,255,0.5); font-size: 14px; pointer-events: none; font-weight: 600; letter-spacing: 1px; z-index: 10; display: none; }

    #canvas-container { width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="juegos.html" class="btn-back"><span class="material-symbols-outlined">arrow_back</span></a>
        <span class="header-title-text">Motor 3D Experimental</span>
      </div>
    </div>
  </header>

  <div class="hud" id="hud" style="display:none;">
    <div class="score-box">PTS: <span id="score-val">0</span></div>
  </div>

  <div class="controls-hint" id="controls-hint">👈 DESLIZA PARA ESQUIVAR 👉</div>

  <div id="canvas-container"></div>

  <div class="overlay" id="start-screen">
    <h1 style="color:var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue);">SIMULADOR 3D</h1>
    <p>Experimenta gráficos acelerados por hardware. Desliza el dedo o usa el mouse para esquivar los obstáculos.</p>
    <button class="btn-action" id="btn-start">INICIAR MOTOR</button>
  </div>

  <div class="overlay" id="game-over-screen" style="display:none;">
    <h1>¡COLISIÓN!</h1>
    <p>Puntaje Final: <span id="final-score" style="font-weight:bold; color:var(--neon-blue);"></span></p>
    <button class="btn-action" onclick="location.reload()">REINICIAR</button>
  </div>

  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- GLTFLoader from CDN -->
  <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
  
  <script>
    let scene, camera, renderer;
    let player, playerFallback;
    const CHUNK_LENGTH = 140;
    const NUM_CHUNKS = 3;
    let roadChunks = [];
    let windowTexture = null;
    let obstacles = [];
    let isPlaying = false;
    let score = 0;
    let speed = 0.5;
    let targetX = 0; // for smooth movement
    const laneWidth = 4;
    const maxLanes = 2; // -2, -1, 0, 1, 2
    
    // Models Cache
    let loadedModels = {
      moto: null,
      auto: null,
      colectivo: null
    };

    // DOM Elements
    const container = document.getElementById('canvas-container');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const scoreVal = document.getElementById('score-val');
    const hint = document.getElementById('controls-hint');

    // Procedural Window Texture for Skyscrapers
    function createWindowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#10121d';
      ctx.fillRect(0, 0, 256, 512);

      const rows = 16;
      const cols = 8;
      const padX = 8;
      const padY = 8;
      const winW = (256 - (cols + 1) * padX) / cols;
      const winH = (512 - (rows + 1) * padY) / rows;

      const colors = [
        'rgba(255, 220, 110, 0.9)', // Warm gold
        'rgba(180, 240, 255, 0.85)', // Cyan blue
        'rgba(255, 255, 255, 0.8)', // Cool white
        'rgba(25, 28, 42, 1)',      // Dark unlit
        'rgba(25, 28, 42, 1)',      // Dark unlit
        'rgba(25, 28, 42, 1)'       // Dark unlit
      ];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const color = colors[Math.floor(Math.random() * colors.length)];
          ctx.fillStyle = color;
          ctx.fillRect(padX + c * (winW + padX), padY + r * (winH + padY), winW, winH);
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    // Procedural Highway Safety Signboard
    function createSignTexture(text, subtitle) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 140;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#0a6332'; // Highway green
      ctx.fillRect(0, 0, 512, 140);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 6;
      ctx.strokeRect(10, 10, 492, 120);

      ctx.fillStyle = '#ffde59';
      ctx.font = 'bold 22px Archivo, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(subtitle.toUpperCase(), 256, 42);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 30px "Archivo Black", sans-serif';
      ctx.fillText(text.toUpperCase(), 256, 92);

      return new THREE.CanvasTexture(canvas);
    }

    // Build single road & city segment
    function createRoadChunk(chunkIndex) {
      const chunk = new THREE.Group();
      chunk.position.z = -chunkIndex * CHUNK_LENGTH;

      // 1. Asphalt Road
      const roadGeo = new THREE.BoxGeometry(22, 0.3, CHUNK_LENGTH);
      const roadMat = new THREE.MeshStandardMaterial({ 
        color: 0x161821, 
        roughness: 0.85, 
        metalness: 0.1 
      });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.position.y = -0.15;
      chunk.add(road);

      // 2. White side borders (Continuous outer lines)
      const borderLineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const borderLineGeo = new THREE.BoxGeometry(0.35, 0.05, CHUNK_LENGTH);
      
      const leftBorder = new THREE.Mesh(borderLineGeo, borderLineMat);
      leftBorder.position.set(-9.8, 0.03, 0);
      chunk.add(leftBorder);

      const rightBorder = new THREE.Mesh(borderLineGeo, borderLineMat);
      rightBorder.position.set(9.8, 0.03, 0);
      chunk.add(rightBorder);

      // 3. Dashed Lane Lines (4 Lanes dividing at -4.9, 0, 4.9)
      const dashMat = new THREE.MeshBasicMaterial({ color: 0xfbd000 });
      const dashGeo = new THREE.BoxGeometry(0.25, 0.04, 4);
      const numDashes = Math.floor(CHUNK_LENGTH / 8);

      [-4.9, 0, 4.9].forEach(laneX => {
        for (let i = 0; i < numDashes; i++) {
          const dash = new THREE.Mesh(dashGeo, dashMat);
          const zPos = -CHUNK_LENGTH / 2 + (i * 8) + 2;
          dash.position.set(laneX, 0.03, zPos);
          chunk.add(dash);
        }
      });

      // 4. Zebra Pedestrian Crosswalk (at center of chunk)
      const zebraMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const zebraGeo = new THREE.BoxGeometry(0.9, 0.04, 5);
      for (let x = -8.5; x <= 8.5; x += 1.8) {
        const zebra = new THREE.Mesh(zebraGeo, zebraMat);
        zebra.position.set(x, 0.035, -CHUNK_LENGTH / 2);
        chunk.add(zebra);
      }

      // 5. Sidewalks & Curbs
      const sidewalkGeo = new THREE.BoxGeometry(10, 0.5, CHUNK_LENGTH);
      const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x3a3d4d, roughness: 0.9 });
      
      const leftSidewalk = new THREE.Mesh(sidewalkGeo, sidewalkMat);
      leftSidewalk.position.set(-16, 0.1, 0);
      chunk.add(leftSidewalk);

      const rightSidewalk = new THREE.Mesh(sidewalkGeo, sidewalkMat);
      rightSidewalk.position.set(16, 0.1, 0);
      chunk.add(rightSidewalk);

      // Concrete Curb Edges
      const curbGeo = new THREE.BoxGeometry(0.4, 0.55, CHUNK_LENGTH);
      const curbMat = new THREE.MeshStandardMaterial({ color: 0x6e7382, roughness: 0.7 });
      
      const leftCurb = new THREE.Mesh(curbGeo, curbMat);
      leftCurb.position.set(-11.1, 0.12, 0);
      chunk.add(leftCurb);

      const rightCurb = new THREE.Mesh(curbGeo, curbMat);
      rightCurb.position.set(11.1, 0.12, 0);
      chunk.add(rightCurb);

      // 6. Streetlights & Trees
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x252834, metalness: 0.8, roughness: 0.3 });
      const lampGlowMat = new THREE.MeshBasicMaterial({ color: 0xffea94 });
      const lightPuddleMat = new THREE.MeshBasicMaterial({ 
        color: 0xffea94, 
        transparent: true, 
        opacity: 0.14,
        blending: THREE.AdditiveBlending 
      });
      const lightPuddleGeo = new THREE.CircleGeometry(5, 16);
      lightPuddleGeo.rotateX(-Math.PI / 2);

      const lampSpacing = 35;
      for (let z = -CHUNK_LENGTH / 2 + 10; z < CHUNK_LENGTH / 2; z += lampSpacing) {
        [-11.6, 11.6].forEach(poleX => {
          const lampGroup = new THREE.Group();
          lampGroup.position.set(poleX, 0, z);

          // Vertical Pole
          const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 6.5, 8), poleMat);
          pole.position.y = 3.25;
          lampGroup.add(pole);

          // Overhang Arm
          const armDir = poleX < 0 ? 1 : -1;
          const arm = new THREE.Mesh(new THREE.BoxGeometry(2, 0.12, 0.12), poleMat);
          arm.position.set(armDir * 0.9, 6.4, 0);
          lampGroup.add(arm);

          // Lamp Fixture
          const lampHead = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.5), poleMat);
          lampHead.position.set(armDir * 1.8, 6.35, 0);
          lampGroup.add(lampHead);

          // Glowing Bulb
          const bulb = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.05, 0.4), lampGlowMat);
          bulb.position.set(armDir * 1.8, 6.25, 0);
          lampGroup.add(bulb);

          // Soft light circle on road
          const puddle = new THREE.Mesh(lightPuddleGeo, lightPuddleMat);
          puddle.position.set(armDir * 3, 0.04, 0);
          lampGroup.add(puddle);

          chunk.add(lampGroup);
        });

        // City Trees between lamps
        [-13.5, 13.5].forEach(treeX => {
          const treeGroup = new THREE.Group();
          treeGroup.position.set(treeX, 0, z + lampSpacing / 2);
          
          const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 0.3, 2, 6),
            new THREE.MeshLambertMaterial({ color: 0x3d2714 })
          );
          trunk.position.y = 1;
          treeGroup.add(trunk);

          const foliage = new THREE.Mesh(
            new THREE.ConeGeometry(1.6, 3.5, 6),
            new THREE.MeshLambertMaterial({ color: 0x1b4d2e })
          );
          foliage.position.y = 3.2;
          treeGroup.add(foliage);

          chunk.add(treeGroup);
        });
      }

      // 7. Modern City Skyscrapers
      const buildingConfigs = [
        { x: -26, w: 14, d: 18, h: 44, z: -20 },
        { x: -30, w: 18, d: 24, h: 68, z: -55 },
        { x: -25, w: 12, d: 16, h: 38, z: -90 },
        { x: -32, w: 20, d: 22, h: 54, z: -125 },
        { x: 26, w: 14, d: 18, h: 48, z: -15 },
        { x: 30, w: 18, d: 22, h: 74, z: -50 },
        { x: 25, w: 13, d: 15, h: 40, z: -85 },
        { x: 31, w: 19, d: 25, h: 60, z: -120 }
      ];

      buildingConfigs.forEach(b => {
        const bGeo = new THREE.BoxGeometry(b.w, b.h, b.d);
        const bMat = new THREE.MeshLambertMaterial({ 
          map: windowTexture, 
          color: 0xcccccc 
        });
        const building = new THREE.Mesh(bGeo, bMat);
        building.position.set(b.x, b.h / 2, b.z + (CHUNK_LENGTH / 2));
        chunk.add(building);

        // Rooftop neon glow trim
        const roofTrimGeo = new THREE.BoxGeometry(b.w + 0.4, 0.8, b.d + 0.4);
        const roofTrimMat = new THREE.MeshBasicMaterial({ 
          color: Math.random() > 0.5 ? 0x00f3ff : 0xff007f 
        });
        const roofTrim = new THREE.Mesh(roofTrimGeo, roofTrimMat);
        roofTrim.position.set(b.x, b.h, b.z + (CHUNK_LENGTH / 2));
        chunk.add(roofTrim);

        // Antenna Spire on tallest buildings
        if (b.h > 50) {
          const antenna = new THREE.Mesh(
            new THREE.CylinderGeometry(0.08, 0.15, 8, 4),
            new THREE.MeshBasicMaterial({ color: 0x00f3ff })
          );
          antenna.position.set(b.x, b.h + 4, b.z + (CHUNK_LENGTH / 2));
          chunk.add(antenna);
        }
      });

      // 8. Overhead Highway Safety Gantry
      const signsList = [
        { text: "USÁ SIEMPRE CASCO", sub: "Seguridad Vial BA" },
        { text: "MÁXIMA 60 km/h", sub: "Respetá los Límites" },
        { text: "ALCOHOL CERO", sub: "Cuidá Tu Vida y la de Todos" }
      ];
      const signInfo = signsList[chunkIndex % signsList.length];

      const gantryGroup = new THREE.Group();
      gantryGroup.position.set(0, 0, 0);

      const trussMat = new THREE.MeshStandardMaterial({ color: 0x4a5060, metalness: 0.9, roughness: 0.3 });
      
      const leftPillar = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 7.5, 6), trussMat);
      leftPillar.position.set(-11, 3.75, 0);
      gantryGroup.add(leftPillar);

      const rightPillar = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 7.5, 6), trussMat);
      rightPillar.position.set(11, 3.75, 0);
      gantryGroup.add(rightPillar);

      const crossbar = new THREE.Mesh(new THREE.BoxGeometry(22.6, 0.4, 0.4), trussMat);
      crossbar.position.set(0, 7.4, 0);
      gantryGroup.add(crossbar);

      const signTex = createSignTexture(signInfo.text, signInfo.sub);
      const signMesh = new THREE.Mesh(
        new THREE.BoxGeometry(13, 3.2, 0.2),
        new THREE.MeshBasicMaterial({ map: signTex })
      );
      signMesh.position.set(0, 5.8, 0);
      gantryGroup.add(signMesh);

      chunk.add(gantryGroup);

      return chunk;
    }

    function initCityEnvironment() {
      windowTexture = createWindowTexture();
      roadChunks = [];

      for (let i = 0; i < NUM_CHUNKS; i++) {
        const chunk = createRoadChunk(i);
        scene.add(chunk);
        roadChunks.push(chunk);
      }
    }

    function init() {
      // 1. Scene setup
      scene = new THREE.Scene();

      // 2. Camera setup
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4.5, 11);
      camera.lookAt(0, 1.8, -20);

      // 3. Renderer setup
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // optimize for mobile
      container.appendChild(renderer.domElement);

      // 4. Lighting (City Night Atmosphere)
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x111625, 0.8);
      hemiLight.position.set(0, 30, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(20, 35, 15);
      scene.add(dirLight);

      // Night sky color & atmospheric fog
      scene.background = new THREE.Color(0x080915);
      scene.fog = new THREE.FogExp2(0x080915, 0.011);

      // 5. Build Procedural City & Road Chunks
      initCityEnvironment();

      // 6. Player Car (Glowing Box Fallback)
      const geometry = new THREE.BoxGeometry(2, 1, 4);
      const material = new THREE.MeshLambertMaterial({ 
        color: 0x00f3ff, 
        emissive: 0x00f3ff,
        emissiveIntensity: 0.5,
        wireframe: false 
      });
      playerFallback = new THREE.Mesh(geometry, material);
      playerFallback.position.set(0, 0, 0);
      
      const wireframe = new THREE.WireframeGeometry(geometry);
      const line = new THREE.LineSegments(wireframe);
      line.material.depthTest = false;
      line.material.opacity = 0.8;
      line.material.transparent = true;
      line.material.color = new THREE.Color(0xffffff);
      playerFallback.add(line);

      // Wrapper for player to hold either fallback or loaded model
      player = new THREE.Group();
      player.position.set(0, 0, 5);
      player.add(playerFallback);

      // Add Moto Headlights shining onto the asphalt
      const motoLight = new THREE.SpotLight(0xffffff, 3, 40, Math.PI / 6, 0.5, 1);
      motoLight.position.set(0, 1, -1);
      motoLight.target.position.set(0, 0, -20);
      player.add(motoLight);
      player.add(motoLight.target);

      scene.add(player);

      // Load 3D Models
      loadModels();

      // Resize handler
      window.addEventListener('resize', onWindowResize, false);
      
      // Input handlers
      setupControls();

      // Start render loop (but game logic paused)
      animate();
    }

    function setupControls() {
      // Touch/Mouse Drag Logic
      let isDragging = false;
      let startX = 0;
      let startPlayerX = 0;

      const onStart = (e) => {
        if (!isPlaying) return;
        isDragging = true;
        startX = e.clientX || (e.touches && e.touches[0].clientX);
        startPlayerX = targetX;
      };

      const onMove = (e) => {
        if (!isDragging || !isPlaying) return;
        let clientX = e.clientX || (e.touches && e.touches[0].clientX);
        let deltaX = clientX - startX;
        
        // Convert screen pixels to 3D world units (approximate scaling)
        let movement = (deltaX / window.innerWidth) * 20; 
        
        let newX = startPlayerX + movement;
        // Clamp to lanes
        targetX = Math.max(-laneWidth * maxLanes, Math.min(laneWidth * maxLanes, newX));
      };

      const onEnd = () => { isDragging = false; };

      document.addEventListener('mousedown', onStart);
      document.addEventListener('touchstart', onStart, {passive: true});
      
      document.addEventListener('mousemove', onMove);
      document.addEventListener('touchmove', onMove, {passive: true});
      
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchend', onEnd);
    }

    function loadModels() {
      const loader = new THREE.GLTFLoader();
      
      const loadModel = (url, key, callback) => {
        loader.load(url, (gltf) => {
          const rawModel = gltf.scene;
          
          // Measure raw bounds
          const rawBox = new THREE.Box3().setFromObject(rawModel);
          const rawCenter = rawBox.getCenter(new THREE.Vector3());
          const rawSize = rawBox.getSize(new THREE.Vector3());
          
          // Center model at origin
          rawModel.position.x = -rawCenter.x;
          rawModel.position.y = -rawBox.min.y; // Sit flat on road (y = 0)
          rawModel.position.z = -rawCenter.z;

          // If model was exported sideways (width X > length Z), rotate 90 degrees
          if (rawSize.x > rawSize.z * 1.15) {
            rawModel.rotation.y = Math.PI / 2;
          }
          
          // Calculate scale to fit lane proportions
          const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z);
          let targetDim = key === 'moto' ? 2.5 : (key === 'colectivo' ? 7.5 : 4.6);
          const scale = targetDim / maxDim;

          const container = new THREE.Group();
          container.add(rawModel);
          container.scale.set(scale, scale, scale);

          // Orient vehicles: moto faces forward down the avenue (-Z)
          if (key === 'moto') {
            container.rotation.y = Math.PI;
          } else {
            // Obstacles face oncoming traffic towards player (+Z)
            container.rotation.y = 0;
          }
          
          loadedModels[key] = container;
          
          if (callback) callback();
        }, undefined, (e) => {
          console.warn(`Error al cargar modelo ${key} (${url}):`, e);
        });
      };

      loadModel('assets/models/moto.glb', 'moto', () => {
        if (player) {
          player.remove(playerFallback);
          player.add(loadedModels.moto);
        }
      });
      loadModel('assets/models/auto.glb', 'auto');
      loadModel('assets/models/colectivo.glb', 'colectivo');
    }

    function spawnObstacle() {
      let obsGroup = new THREE.Group();
      
      // Select random model or fallback
      let keys = ['auto', 'colectivo'];
      let randomKey = keys[Math.floor(Math.random() * keys.length)];
      
      if (loadedModels[randomKey]) {
        let modelClone = loadedModels[randomKey].clone();
        obsGroup.add(modelClone);
      } else {
        // Fallback cube
        const geometry = new THREE.BoxGeometry(3, 2, 3);
        const material = new THREE.MeshLambertMaterial({ 
          color: 0xff007f, 
          emissive: 0xff007f,
          emissiveIntensity: 0.8
        });
        const mesh = new THREE.Mesh(geometry, material);
        const wireframe = new THREE.WireframeGeometry(geometry);
        const line = new THREE.LineSegments(wireframe);
        line.material.color = new THREE.Color(0xffffff);
        mesh.add(line);
        mesh.position.y = 1;
        obsGroup.add(mesh);
      }
      
      // Random lane
      const lane = Math.floor(Math.random() * (maxLanes * 2 + 1)) - maxLanes;
      obsGroup.position.set(lane * laneWidth, 0, -130);

      scene.add(obsGroup);
      obstacles.push(obsGroup);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // AABB Collision check
    function checkCollision(obj1, obj2) {
      const box1 = new THREE.Box3().setFromObject(obj1);
      const box2 = new THREE.Box3().setFromObject(obj2);
      // Shrink hitbox slightly for better gameplay feel
      box1.expandByScalar(-0.3);
      box2.expandByScalar(-0.3);
      return box1.intersectsBox(box2);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (isPlaying) {
        // Move Road Chunks for seamless infinite city
        roadChunks.forEach(chunk => {
          chunk.position.z += speed;
          if (chunk.position.z > CHUNK_LENGTH) {
            chunk.position.z -= CHUNK_LENGTH * NUM_CHUNKS;
          }
        });

        // Smooth player movement (lerp)
        player.position.x += (targetX - player.position.x) * 0.1;
        // Add slight tilt based on movement for realism
        player.rotation.z = -(targetX - player.position.x) * 0.05;

        // Manage Obstacles
        if (Math.random() < 0.03 + (speed * 0.01)) { // spawn rate increases with speed
          spawnObstacle();
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          let obs = obstacles[i];
          obs.position.z += speed;

          // Check Collision
          if (checkCollision(player, obs)) {
            isPlaying = false;
            document.getElementById('final-score').innerText = Math.floor(score);
            gameOverScreen.style.display = 'flex';
            hud.style.display = 'none';
            hint.style.display = 'none';
            break;
          }

          // Remove if passed
          if (obs.position.z > 15) {
            scene.remove(obs);
            obstacles.splice(i, 1);
            score += 10;
            scoreVal.innerText = Math.floor(score);
            // Increase speed slightly
            speed = Math.min(1.5, speed + 0.01);
          }
        }
      }

      renderer.render(scene, camera);
    }

    document.getElementById('btn-start').addEventListener('click', () => {
      startScreen.style.display = 'none';
      hud.style.display = 'flex';
      hint.style.display = 'block';
      // Fade out hint after 3 seconds
      setTimeout(() => { hint.style.opacity = '0'; transition = 'opacity 1s'; }, 3000);
      
      score = 0;
      speed = 0.5;
      scoreVal.innerText = '0';
      targetX = 0;
      player.position.x = 0;
      
      // Clear old obstacles
      obstacles.forEach(obs => scene.remove(obs));
      obstacles = [];
      
      isPlaying = true;
    });

    // Initialize Three.js scene
    init();

  </script>
</body>
</html>
